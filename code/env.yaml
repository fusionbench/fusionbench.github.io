# ==================== 全局环境配置 ====================
name: fusionbench
version: "1.0.0"
description: "FusionBench: A comprehensive Benchmark for QA under Ambiguity and Heterogeneity"

# ==================== LLM 服务配置 ====================
llm_config:
  temperature: 0.0 # 温度参数，控制生成随机性
  max_retries: 3 # 最大重试次数
  retry_interval: 2.0 # 重试间隔（秒）

# ==================== LLM 提供商配置 ====================
llm_providers:
  openai:
    api_key: "OpenAI API Key"
    base_url: "https://api.openai.com/v1/"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"


# ==================== 日志配置 ====================
logging:
  level: "INFO" # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
